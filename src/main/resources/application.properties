spring.application.name=fds_radar

#MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/fds_radar?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#Server
server.port=9090
server.servlet.session.timeout=30s
ai.server.url=http://localhost:8001

fraud.threshold=0.70
fraud.priority.low-min=0.70
fraud.priority.medium-min=0.80
fraud.priority.high-min=0.90